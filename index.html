<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  if (!window.THREE || !THREE.OrbitControls) { $('err').style.display = 'grid'; $('err').textContent = '3Dの部品を読み込めませんでした。電波のよい所で開き直してください。'; return; }
  const DATA = window.PLAN3D, KEYS = Object.keys(DATA), S = 0.001, CUTH = 1400;
  const V3 = (x, y, z) => new THREE.Vector3(x * S, z * S, -y * S);           // 図面（x東・y北・z上, mm）→ 3D（m・y上）
  const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();

  const cv = $('cv');
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.localClippingEnabled = true; renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(38, 1, 0.05, 400);
  const ctl = new THREE.OrbitControls(cam, cv); ctl.enableDamping = true; ctl.dampingFactor = 0.12; ctl.maxPolarAngle = Math.PI * 0.47; ctl.minDistance = 3; ctl.maxDistance = 80;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa3ad, 0.62));
  const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 80 }); sun.shadow.bias = -0.0005;
  scene.add(sun, sun.target);
  const setBg = () => { scene.background = new THREE.Color(css('--scene') || '#eaf0f6'); };
  setBg(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setBg);
  new MutationObserver(setBg).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  /* 床から1.4mで切る（立体の平面図）。切り口は濃い色で塗る */
  const clip = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1);
  const POCHE = new THREE.MeshBasicMaterial({ color: 0x34404d, side: THREE.BackSide, clippingPlanes: [clip] });
  const EDGE = new THREE.LineBasicMaterial({ color: 0x4a5560, transparent: true, opacity: 0.45, clippingPlanes: [clip] });
  function geom(v, f) {
    const pos = [];
    for (const fc of f) for (let i = 1; i < fc.length - 1; i++) for (const k of [fc[0], fc[i], fc[i + 1]]) { const p = v[k]; pos.push(p[0] * S, p[2] * S, -p[1] * S); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals(); return g;
  }
  const world = new THREE.Group(); scene.add(world);
  const labels = new THREE.Group(); scene.add(labels);
  let G = {};
  function solid(m, name) {
    const g = geom(m.v, m.f), op = m.o, grp = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: m.c, roughness: 0.92, metalness: 0, transparent: op < 1, opacity: op, depthWrite: op >= 1,
      side: op < 1 ? THREE.DoubleSide : THREE.FrontSide, clippingPlanes: [clip], polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
    const me = new THREE.Mesh(g, mat); me.castShadow = op >= 1; me.receiveShadow = true; grp.add(me);
    if (op >= 1) { grp.add(new THREE.Mesh(g, POCHE)); grp.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 12), EDGE)); }
    world.add(grp); G[name] = grp;
  }
  function label(text, sub, x, y, z, big) {
    const c = document.createElement('canvas'); c.width = 512; c.height = 168; const g = c.getContext('2d');
    g.textAlign = 'center'; g.fillStyle = 'rgba(255,255,255,.86)';
    g.font = `600 ${big ? 54 : 46}px "Shippori Mincho", "Hiragino Mincho ProN", serif`;
    const w = Math.min(500, Math.max(g.measureText(text).width, sub ? 150 : 0) + 34); g.fillRect(256 - w / 2, 14, w, sub ? 136 : 76);
    g.fillStyle = '#1a4b8c'; g.fillText(text, 256, 70);
    if (sub) { g.font = `400 40px "Shippori Mincho", "Hiragino Mincho ProN", serif`; g.fillStyle = '#7a3b1e'; g.fillText(sub, 256, 128); }
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true }));
    sp.position.copy(V3(x, y, z)); sp.scale.set(big ? 2.8 : 2.35, big ? 0.92 : 0.77, 1);   /* スマホで読める大きさ */ sp.renderOrder = 10; labels.add(sp);
  }
  /* 畳は割り切った数（2026-10-18 菅原さん：6.1畳→6畳・10.2畳→10畳・28.6畳→28畳・玄関2.6畳→2.5畳）＝5畳以上は1畳単位、小さい部屋は0.5畳単位で切り捨て */
  const joA = a => { const v = a / 1.62, q = v >= 5 ? Math.floor(v + 1e-9) : Math.floor(v * 2 + 1e-9) / 2; return `${q}畳`; };
  const jo = r => joA((r.x1 - r.x0) * (r.y1 - r.y0) / 1e6);

  function clear() {
    for (const grp of [world, labels]) {

      while (grp.children.length) grp.remove(grp.children[0]);
    }
    G = {};
  }
  function load(k) {
    PK = k; P = DATA[k]; clear();
    clip.constant = (P.FL0 + CUTH) * S;
    const W = P.W, D = P.D;
    const gr = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0xdde6dc, roughness: 1 }));
    gr.rotation.x = -Math.PI / 2; gr.position.copy(V3(W / 2, D / 2, -5)); gr.receiveShadow = true; world.add(gr);
    for (const [name, m] of Object.entries(P.meshes)) solid(m, name);
    for (const r of P.rooms) {
      const cx = (r.x0 + r.x1) / 2, cy = (r.y0 + r.y1) / 2;
      if (r.n === 'LDK') { label(`LDK ${jo(r)}`, '台所 ±0・リビング −400', cx, (r.y0 + r.y1) / 2 - 900, P.LIV + 60, true); continue; }
      label(r.n, jo(r), cx, cy + (r.n.startsWith('寝室') ? 700 : 0), (r.z || P.FL0) + 60);
    }
    label('海', '南', W / 2, -4200, 0);
    sun.position.copy(V3(W / 2 - 12000, -16000, 22000)); sun.target.position.copy(V3(W / 2, D / 2, 0));
    $('meta').innerHTML = `<b>${P.name}</b>　延床 ${P.area}㎡（${P.tsubo}坪）・LDK ${joA(P.ldk)}<br>床から1.4mの高さで切った模型です。検討中の平面です（2026年10月18日）。`;
    document.querySelectorAll('#plans button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === k)));
    setFurn(furn); setView(view);
  }
  function fit(w, h) {                                                     /* 画面の縦横に合わせて、模型が収まる距離 */
    const v = cam.fov * Math.PI / 360, a = cam.aspect, hh = Math.atan(Math.tan(v) * a);
    return Math.max((w / 2) / Math.tan(hh), (h / 2) / Math.tan(v)) * 1.18;
  }
  function setView(v) {
    view = v; const W = P.W * S, D = P.D * S, c = V3(P.W / 2, P.D / 2, 0);
    if (v === 'top') { const d = fit(W + 2, D + 4); cam.position.set(c.x, d, c.z + 0.001); }
    else { const d = fit(W + 2, D + 4) * 0.88; cam.position.set(c.x + d * 0.38, d * 0.72, c.z + d * 0.62); }
    ctl.target.copy(c); ctl.update();
    $('v-oblique').setAttribute('aria-pressed', String(v === 'oblique')); $('v-top').setAttribute('aria-pressed', String(v === 'top'));
  }
  function setFurn(f) { furn = f; for (const g of ['furn', 'bed', 'fix', 'fire', 'closet']) if (G[g]) G[g].visible = f; $('t-furn').setAttribute('aria-pressed', String(f)); }
  for (const k of KEYS) { const b = document.createElement('button'); b.dataset.k = k; b.textContent = DATA[k].name; b.onclick = () => load(k); $('plans').appendChild(b); }
  $('v-oblique').onclick = () => setView('oblique'); $('v-top').onclick = () => setView('top'); $('t-furn').onclick = () => setFurn(!furn);
  let text = false;                                                      /* 文字（部屋名・上の説明・使い方）。最初は消しておき、押すと出る（2026-10-17 菅原さん） */
  function setText(t) { text = t; labels.visible = t; $('head').hidden = !t; $('hint').hidden = !t; $('t-text').setAttribute('aria-pressed', String(t)); $('t-text').textContent = t ? '文字を消す' : '文字を出す'; }
  labels.visible = false;
  $('t-text').onclick = () => setText(!text);
  function resize() { const w = cv.clientWidth, h = cv.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  window.addEventListener('resize', () => { resize(); setView(view); });
  resize();
  const start = () => { load(PK); (function loop() { ctl.update(); renderer.render(scene, cam); requestAnimationFrame(loop); })(); };
  (document.fonts && document.fonts.load ? document.fonts.load('600 46px "Shippori Mincho"').catch(() => {}) : Promise.resolve()).then(start, start);
